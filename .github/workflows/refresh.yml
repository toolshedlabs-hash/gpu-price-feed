name: refresh prices

on:
  schedule:
    # 06:15 UTC daily. Off the hour on purpose, the hour is the busiest slot on
    # the shared runners and scheduled jobs get delayed there.
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "collect.py"
      - "render_readme.py"
      - "lib/**"
      - "providers/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect prices
        id: collect
        continue-on-error: true
        run: python3 collect.py

      - name: Render README
        run: python3 render_readme.py

      - name: Commit
        run: |
          git config user.name "gpu-price-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Fail the run if any provider broke
        run: |
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "collect.py did not exit clean, see the log and data/status.json"
            python3 -c "
          import json
          s = json.load(open('data/status.json'))
          for k, v in sorted(s['providers'].items()):
              if v['status'] != 'ok':
                  print(k, v['status'], v.get('error') or v.get('anomalies'))
          for a in s.get('anomalies') or []:
              print('anomaly:', a)
          "
            exit 1
          fi
